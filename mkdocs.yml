site_name: Barman Cloud Plugin dev

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - def_list
  - md_in_html

plugins:
  - search

theme:
  name: material
  custom_dir: docs/overrides
  favicon: img/favicon.ico

  logo_dark_mode: 'img/logo-dark.png'
  logo_light_mode: 'img/logo-light.png'

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.prune
    - navigation.top
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  generator: false

repo_url: https://github.com/pgEdge/postgresql-docs

nav:
  - Barman Cloud Plugin dev: index.md
  - Barman Cloud Plugin: intro.md
  - Main Concepts: concepts.md
  - Installation: installation.md
  - Upgrades: upgrades.md
  - Using the Barman Cloud Plugin: usage.md
  - Migrating from Built-in CloudNativePG Backup: migration.md
  - Object Store Providers: object_stores.md
  - Observability: observability.md
  - Retention Policies: retention.md
  - Compression: compression.md
  - Resource name migration guide: resource-name-migration.md
  - Troubleshooting: troubleshooting.md
  - Miscellaneous: misc.md
  - Container Images: images.md
  - Parameters: parameters.md
  - API Reference: plugin-barman-cloud.v1.md
